version: 2

updates:
  # Les actions sont épinglées sur des SHA : sans Dependabot, elles ne
  # bougeraient jamais, y compris pour un correctif de sécurité.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  # Dependabot gère les catalogues pnpm depuis février 2025. Un défaut connu
  # subsiste : le pnpm-lock.yaml qu'il produit peut perdre des entrées du
  # catalogue. `vp install --frozen-lockfile` le rejette alors en intégration,
  # ce qui est le comportement voulu — la pull request échoue au lieu d'être
  # fusionnée.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      toolchain:
        patterns: ['*']
    ignore:
      # Le jeu tourne sur jQuery 1.8.2 : ces types décrivent ce runtime, ils ne
      # sont pas en retard. Les relever ferait décrire au typage une API qui
      # n'existe pas à l'exécution.
      - dependency-name: '@types/jquery'
      # Les types de Node doivent suivre le runtime, jamais le devancer : la
      # version est épinglée dans .node-version. Les correctifs et mineures de
      # la ligne courante restent proposés ; la majeure suivra un changement
      # délibéré de .node-version.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
