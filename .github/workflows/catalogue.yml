name: Veille sur le catalogue

# Le catalogue reference des scripts que nous n'écrivons pas et ne contrôlons
# pas. Deux choses s'y dégradent sans que personne ne l'apprenne :
#
# - un script retiré de Greasy Fork, ou une révision épinglée supprimée par son
#   auteur, casse en silence chez les joueurs qui l'avaient activé ;
# - une correction publiée en amont n'atteint jamais personne, puisque chaque
#   entrée est figée sur une révision précise.
#
# Le premier cas part dans une issue plutôt que dans un échec d'intégration :
# un job qui rougit tous les jours finit ignoré, une issue se traite.
#
# Le second ouvre une pull request par script, à la manière de Dependabot
# (tools/catalogue-pr.ts) : repin, liste de secours régénérée, et un rapport
# d'aide à la relecture. Rien n'est fusionné automatiquement : le catalogue
# engage la responsabilité du projet, et fusionner déploie.

on:
  schedule:
    - cron: '17 6 * * *'
  # Après une fusion, les autres pull requests sont recalées sur `main` et
  # celles devenues sans objet fermées, sans attendre le lendemain.
  push:
    branches: [main]
    paths: ['data/scripts.json']
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Essai à blanc : n'ouvre ni ne modifie aucune pull request, ne touche pas à l'issue"
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: catalogue
  cancel-in-progress: false

env:
  TITRE: 'Catalogue : scripts injoignables'

jobs:
  veille:
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # L'outil n'utilise que la bibliothèque standard : pas d'installation de
      # dépendances, pas de toolchain.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Scripts injoignables
        id: injoignables
        run: |
          set -euo pipefail
          {
            echo 'liste<<FIN'
            node tools/check-catalogue.mjs
            echo 'FIN'
          } >> "$GITHUB_OUTPUT"

      - name: Ouvrir, mettre à jour ou clore l'issue
        env:
          GH_TOKEN: ${{ github.token }}
          INJOIGNABLES: ${{ steps.injoignables.outputs.liste }}
        run: |
          set -euo pipefail

          numero=$(gh issue list --state open --limit 100 --json number,title \
            --jq '[.[] | select(.title == env.TITRE)][0].number // empty')

          if [ -z "$INJOIGNABLES" ]; then
            if [ -n "$numero" ]; then
              gh issue close "$numero" \
                --comment 'Le catalogue est de nouveau intact : tous les scripts répondent.'
            fi
            echo 'Catalogue intact.'
            exit 0
          fi

          {
            echo "Relevé automatique du $(date -u '+%d/%m/%Y'). Voir .github/workflows/catalogue.yml."
            echo
            echo '## Injoignables'
            echo
            echo 'Ces scripts ne se chargent plus chez les joueurs qui les ont activés.'
            echo 'Une révision épinglée supprimée par son auteur donne un 410 : la pull'
            echo 'request de repin ouverte par la veille, s'"'"'il y en a une, la corrige.'
            echo
            echo "$INJOIGNABLES"
          } > corps.md

          if [ -n "$numero" ]; then
            gh issue edit "$numero" --body-file corps.md
            echo "Issue #$numero mise à jour."
          else
            gh issue create --title "$TITRE" --body-file corps.md
          fi

  mises-a-jour:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Le GITHUB_TOKEN de ce dépôt ne peut pas ouvrir de pull request, et
      # celles qu'il ouvrirait ne déclencheraient pas l'intégration. Le jeton
      # dédié, celui de release-please, lève les deux.
      - name: Jeton disponible
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [ -z "$RELEASE_TOKEN" ]; then
            echo "::error::Le secret RELEASE_TOKEN manque : impossible d'ouvrir les pull requests de repin."
            exit 1
          fi

      # Ce jeton est aussi celui que git utilisera pour pousser les branches
      # `catalogue/*`.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      # Pas d'installation de dépendances : l'outil n'utilise que la
      # bibliothèque standard, et le rendu de la liste de secours de
      # @dreadcast/registry, que Node exécute sans toolchain.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Ouvrir ou mettre à jour les pull requests
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: node tools/catalogue-pr.ts $DRY_RUN
