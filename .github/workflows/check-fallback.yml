name: Check Embedded Fallback List

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # No dependency needed: the tool only uses the node standard library.
      - name: Fallback list matches data/scripts.json
        run: node tools/sync-fallback.mjs --check
