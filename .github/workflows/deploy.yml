name: Build Userscripts

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js & Yarn
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - run: yarn install
      - run: yarn build

      - uses: actions/upload-artifact@v4
        with:
          name: dreadcast-userscripts
          path: dist/*.user.js
