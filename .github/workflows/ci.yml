name: CI

on:
  push:
    branches: [main]
  pull_request:

# Vite+ pilote toute la chaîne : format (Oxfmt), lint (Oxlint), types
# (tsgolint), tests (Vitest) et build (Vite 8 + Rolldown). Node est fourni par
# `vp env`, à la version épinglée dans .node-version.
env:
  CI: '1'
  VP_NODE_MANAGER: 'yes'
  # `curl | bash` installerait sinon la dernière version publiée : l'intégration
  # pourrait casser sans qu'une ligne du dépôt ait bougé. À garder aligné sur la
  # dépendance `vite-plus` du package.json racine.
  VP_VERSION: '0.2.9'

# Une poussée en chasse une autre sur la même pull request. Sur `main`, chaque
# exécution va au bout : elle valide un état qui sera publié.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# L'intégration ne publie rien : elle n'a aucun besoin d'écriture.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Actions épinglées sur des SHA : une étiquette mobile laisserait le code
      # exécuté ici changer sans que le dépôt bouge. Dependabot propose les
      # montées de version.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Necessaire pour comparer une pull request a sa base.
          fetch-depth: 0

      - name: Installer Vite+
        run: |
          curl -fsSL https://vite.plus | bash
          echo "$HOME/.vite-plus/bin" >> "$GITHUB_PATH"

      - name: Cache du store pnpm
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pnpm-store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Cache des tâches Vite Task
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .vite-task
          key: vite-task-${{ runner.os }}-${{ github.sha }}
          restore-keys: vite-task-${{ runner.os }}-

      - run: vp install --frozen-lockfile

      # Une seule passe : formatage, lint et vérification de types.
      - run: vp check

      # Le build passe avant les tests : le test d'intégration du gestionnaire
      # porte sur les fichiers construits, pas sur les sources.
      - run: vp run -r build

      - run: vp test --run

      # Le catalogue est validé par son schéma, et la liste de secours
      # embarquée dans le gestionnaire doit correspondre à data/scripts.json.
      - run: vp run --filter @dreadcast/registry check

      # `published/` appartient à la chaîne de publication : elle seule y écrit,
      # après avoir construit. Une retouche à la main donnerait un fichier servi
      # aux joueurs qui ne correspond à aucun code du dépôt, et serait écrasée
      # sans avertissement à la publication suivante.
      #
      # On ne compare pas son contenu à un build de HEAD : entre deux
      # publications, `published/` est légitimement en retard sur les sources.
      # Cette comparaison n'a de sens que sur le commit qui le produit, et c'est
      # la publication elle-même qui la fait.
      - name: published/ n'est modifié que par la chaîne de publication
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail

          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -q '^published/'; then
            echo "::error::published/ est produit par la chaîne de publication. Retirer ces modifications, elles seront écrasées."
            exit 1
          fi

          echo 'published/ intact.'

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dreadcast-userscripts
          path: |
            published/*.user.js
            published/*.meta.js
