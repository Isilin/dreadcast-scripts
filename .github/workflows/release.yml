name: Release

# Publie les userscripts construits dans `published/`, sur `main`, d'où Greasy
# Fork les resynchronise par webhook.
#
# Deux règles gouvernent ce workflow, l'une et l'autre apprises à leurs dépens :
#
# 1. Greasy Fork n'agit que sur un fichier qui apparaît en `modified` dans le
#    push. On écrit donc par-dessus des fichiers qui existent déjà, sans jamais
#    les supprimer au préalable et sans `--force`.
# 2. Le gestionnaire épingle le DDK par `?version=`, identifiant que Greasy Fork
#    n'attribue qu'une fois la synchronisation faite. Le DDK part donc en
#    premier, et le gestionnaire attend cet identifiant avant d'être construit.
#
# Les numéros de version et les changelogs sont produits par release-please, à
# partir des commits. Il ouvre une pull request de release ; la fusionner
# déclenche la publication, dans le même job — la publication doit lire les
# package.json déjà incrémentés.
#
# La marche à suivre complète est dans docs/publication.md.

on:
  push:
    branches: [main]
    # Les commits de publication touchent `published/` : sans cela, le workflow
    # se rappellerait lui-même à chaque publication.
    paths-ignore: ['published/**']
  workflow_dispatch:
    inputs:
      publish_dcsm:
        description: 'Publier aussi le gestionnaire (décocher pour un essai à blanc)'
        type: boolean
        default: true

env:
  CI: '1'
  VP_NODE_MANAGER: 'yes'
  VP_VERSION: '0.2.9'

permissions:
  contents: write
  pull-requests: write

# Deux publications ne doivent jamais pousser sur `main` en même temps, et
# aucune ne doit être interrompue en cours de route.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Ouvre ou met à jour la pull request de release. `releases_created` ne
      # vaut vrai que lorsqu'elle vient d'être fusionnée : c'est ce qui
      # distingue un commit ordinaire d'une publication.
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # Le jeton par defaut echoue quand le depot interdit aux Actions de
          # creer des pull requests, et les pull requests qu'il ouvre ne
          # declenchent aucun workflow. Le jeton dedie leve les deux.
          token: ${{ secrets.RELEASE_TOKEN || github.token }}

      - name: Rien à publier
        if: steps.release.outputs.releases_created != 'true' && github.event_name != 'workflow_dispatch'
        run: |
          echo "Aucune release creee. La pull request de release attend sa fusion."

      # `main` porte déjà, à ce stade, le commit de release et ses versions
      # incrémentées.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        if: steps.release.outputs.releases_created == 'true' || github.event_name == 'workflow_dispatch'
        with:
          ref: main

      - name: Installer Vite+
        if: steps.release.outputs.releases_created == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          curl -fsSL https://vite.plus | bash
          echo "$HOME/.vite-plus/bin" >> "$GITHUB_PATH"

      - name: Vérifier et construire
        if: steps.release.outputs.releases_created == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          vp install --frozen-lockfile
          vp check
          vp run -r build
          vp test --run

      - name: Relever les versions
        id: versions
        if: steps.release.outputs.releases_created == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          {
            echo "ddk=$(node -p "require('./packages/ddk/package.json').version")"
            echo "dcsm=$(node -p "require('./packages/dcsm/package.json').version")"
          } >> "$GITHUB_OUTPUT"

      - name: Configurer git
        if: steps.release.outputs.releases_created == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Publier le DDK
        id: ddk
        if: steps.release.outputs.releases_created == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          cp packages/ddk/dist/ddk.user.js packages/ddk/dist/ddk.meta.js published/

          if git diff --quiet -- published/; then
            echo 'DDK inchangé, rien à publier.'
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git add published/
          git commit -m "build(ddk): publie la version ${{ steps.versions.outputs.ddk }}"
          git push origin main
          echo 'changed=true' >> "$GITHUB_OUTPUT"

      # Greasy Fork n'attribue l'identifiant de version qu'après avoir
      # synchronisé. Sans cette attente, le gestionnaire serait épinglé sur le
      # DDK précédent -- exactement la panne que l'épinglage doit empêcher.
      - name: Attendre la synchronisation du DDK
        id: pin
        if: steps.release.outputs.releases_created == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          {
            echo "version=$(node tools/greasyfork.mjs wait 507382 '${{ steps.versions.outputs.ddk }}')"
          } >> "$GITHUB_OUTPUT"

      # Sur un declenchement par tag, `inputs` est vide : GitHub convertit la
      # chaine vide et `false` en 0, donc `inputs.publish_dcsm != false` serait
      # faux et le gestionnaire ne partirait jamais. On teste l'evenement.
      - name: Publier le gestionnaire
        if: >-
          (steps.release.outputs.releases_created == 'true' || github.event_name ==
          'workflow_dispatch') && (github.event_name != 'workflow_dispatch' ||
          inputs.publish_dcsm)
        env:
          DCSM_DDK_VERSION: ${{ steps.pin.outputs.version }}
        run: |
          set -euo pipefail
          vp run --filter @dreadcast/dcsm build
          cp packages/dcsm/dist/dcsm.user.js packages/dcsm/dist/dcsm.meta.js published/

          if git diff --quiet -- published/; then
            echo 'Gestionnaire inchangé, rien à publier.'
            exit 0
          fi

          grep -q "version=${DCSM_DDK_VERSION}" published/dcsm.user.js \
            || { echo "L'épingle du DDK n'a pas été injectée."; exit 1; }

          git add published/
          git commit -m "build(dcsm): publie la version ${{ steps.versions.outputs.dcsm }}"
          # `main` a pu bouger pendant l'attente de Greasy Fork.
          git pull --rebase origin main
          git push origin main

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.release.outputs.releases_created == 'true' || github.event_name == 'workflow_dispatch'
        with:
          name: dreadcast-userscripts
          path: published/*.js
