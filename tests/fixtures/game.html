<!--
  Extrait réduit de la page de jeu (vendor/dreadcast.net/Main.html), limité aux
  éléments que le DDK et le DCSM manipulent. Le balisage, les classes et les
  gestionnaires en dur sont recopiés tels quels : c'est ce que les sélecteurs
  doivent trouver en production.

  Le fichier d'origine n'est pas versionné (il fait 282 ko et appartient au
  jeu). Pour le régénérer après une mise à jour du jeu, comparer les blocs
  ci-dessous avec la page réelle.
-->
<div id="loader" style="display: none"></div>

<ul class="menus">

  <li class="parametres couleur5 right hover" onclick="$(this).find('ul').slideDown()">

      <li class="link couleur2 separator">Gestion du compte</li>

      <li class="link couleur2">Gestion de la fiche personnage</li>
      <li class="link couleur2 separator">Réactions de personnage</li>
    </ul>
  </li>
  <li class="statistics link couleur5 left">Statistiques</li>
  <li class="separator"></li>
  <!-- Second menu déroulant : addSubMenuTo ne doit jamais viser celui-ci. -->

      <li class="link couleur2 separator">Forum</li>
