packages:
  - 'packages/*'
  - 'scripts/*'

# Versions des dependances externes, declarees une seule fois pour tout le
# depot. Les manifestes les reprennent avec `catalog:`, ce qui evite qu'un
# paquet derive et fasse cohabiter deux copies dans node_modules.
catalog:
  # Epingle sur la ligne 1.10 : le jeu embarque jQuery 1.8.2. Les types 3.x ou
  # 4.x decriraient une API qui n'existe pas a l'execution ($.type, .bind,
  # .size). Ne pas relever sans changer le jQuery de la page, ce qui n'est pas
  # de notre ressort.
  '@types/jquery': 1.10.45
  '@types/node': ^24.13.6
  '@vitejs/plugin-basic-ssl': ^2.3.0
  jsdom: ^30.1.1
  typescript: ^7.0.2
  vite: ^8.3.0
  vite-plugin-monkey: ^8.1.1
  vite-plus: ^0.3.3
  vitest: ^5.0.1
  zod: ^4.6.5
