packages:
  - 'packages/*'
  - 'scripts/*'

# jquery@1.8.2 declare jsdom 0.2 et contextify -- un module natif -- comme
# dependances d'execution, alors que ce sont celles de son harnais de test de
# 2012. Seul `dist/jquery.js` est charge : rien n'a besoin d'etre compile, et
# une compilation native casserait l'integration continue pour rien.
allowBuilds:
  contextify: false

# Versions des dependances externes, declarees une seule fois pour tout le
# depot. Les manifestes les reprennent avec `catalog:`, ce qui evite qu'un
# paquet derive et fasse cohabiter deux copies dans node_modules.
catalog:
  # Epingle sur la ligne 1.10 : le jeu embarque jQuery 1.8.2. Les types 3.x ou
  # 4.x decriraient une API qui n'existe pas a l'execution ($.type, .bind,
  # .size). Ne pas relever sans changer le jQuery de la page, ce qui n'est pas
  # de notre ressort.
  '@types/jquery': 1.10.45
  '@types/node': ^26.2.0
  '@vitejs/plugin-basic-ssl': ^2.3.0
  # Version exacte embarquee par le jeu. Sert uniquement aux tests : la couche
  # de compatibilite est verifiee contre le vrai runtime, pas contre une
  # approximation.
  jquery: 1.8.2
  jsdom: ^30.0.1
  typescript: ^7.0.2
  vite: ^8.2.1
  vite-plugin-monkey: ^8.1.0
  vite-plus: ^0.2.9
  vitest: ^4.1.10
  zod: ^4.4.3
